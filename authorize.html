<!DOCTYPE html>
<html>
<head>
    <title>Authorize Students</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border: 1px solid #ddd; }
        .face-image { width: 100px; height: 100px; object-fit: cover; }
        .actions { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <h1>Pending Approvals</h1>
    <table>
        <tr>
            <th>Face Image</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>
                <img src="data:image/jpeg;base64,{{ student.face_image.split(',')[1] }}" 
                     class="face-image" 
                     alt="Student Face">
            </td>
            <td>{{ student.name }}</td>
            <td>{{ student.roll_no }}</td>
            <td>{{ student.email }}</td>
            <td class="actions">
                <a href="/approve/{{ student._id }}">✅ Approve</a>
                <a href="/reject/{{ student._id }}">❌ Reject</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="/" style="display: inline-block; margin-top: 20px;">
        <button>Back to Dashboard</button>
    </a>
</body>
</html>
