<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System | Smart Education</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
        }

        .card i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #4a5568;
        }

        .card h2 {
            color: #2d3748;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: #718096;
            font-size: 0.9rem;
        }

        .admin-login {
            text-align: center;
            margin-top: 2rem;
        }

        .admin-btn {
            padding: 0.8rem 2rem;
            background: #4a5568;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-btn:hover {
            background: #2d3748;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 AI-Powered Attendance System</h1>
        
        <div class="grid">
            <div class="card">
                <i class="fas fa-user-plus"></i>
                <h2>Register Student</h2>
                <p>Add new students to the system with facial recognition</p>
            </div>

            <div class="card">
                <i class="fas fa-calendar-check"></i>
                <h2>View Attendance</h2>
                <p>Access detailed attendance records and reports</p>
            </div>

            <div class="card">
                <i class="fas fa-camera"></i>
                <h2>Mark Attendance</h2>
                <p>Automated attendance marking using AI vision</p>
            </div>
        </div>

        <div class="admin-login">
            <button class="admin-btn">
                <i class="fas fa-lock"></i> Admin Login
            </button>
        </div>
    </div>
</body>
</html>
